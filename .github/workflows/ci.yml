# The V13.1 allot gates (TEST_RELEASE.command, TEST_HARDENING.command, TEST_MIRI.command), mapped onto
# the same jobs as scope and ob-serve-a-bowl. A `v*` tag publishes, after test and miri pass,
# through crates.io trusted publishing: no stored token.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --all-features --all-targets --locked
      - run: cargo test --release --test hardening --locked
      - run: cargo check --all-features --all-targets --locked
      - name: Build the package exactly as publish would
        run: cargo package --locked

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri setup
      - name: TEST_MIRI.command (the allot tests), plain and with strict provenance
        run: |
          for flags in "" "-Zmiri-strict-provenance"; do
            echo "== MIRIFLAGS='$flags'"
            export MIRIFLAGS="$flags"
            cargo +nightly miri test --test memory rawbuf_grows_and_preserves_values -- --exact
            cargo +nightly miri test --test memory arena_reset_runs_destructors_and_reuses_storage -- --exact
          done

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, miri]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned to commits: this job can get a crates.io token. The runner's own stable cargo is used.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches Cargo.toml version, and CHANGELOG.md has its entry
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          grep -qF "## $version (" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version (date)' entry"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
